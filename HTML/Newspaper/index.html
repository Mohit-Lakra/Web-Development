<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newspaper Subscription Form</title>
</head>

<body>

  <h1>Daily Times Subscription</h1>

  <h2>Subscription Plans</h2>

  <table border="1">
    <tr>
      <th>Plan</th>
      <th>Price</th>
      <th>Features</th>
    </tr>

    <tr>
      <td>Basic</td>
      <td>₹99 / Month</td>
      <td>Access to Daily News Articles</td>
    </tr>

    <tr>
      <td>Standard</td>
      <td>₹199 / Month</td>
      <td>Daily News + Sports + Entertainment</td>
    </tr>

    <tr>
      <td>Premium</td>
      <td>₹299 / Month</td>
      <td>All Content + Exclusive Reports</td>
    </tr>
  </table>

  <hr>

  <h2>Register & Choose Your Plan</h2>

  <form action="newspaper.html">

    <p>
      <label for="name">Full Name:</label><br>
      <input type="text" id="name" name="name" required>
    </p>

    <p>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required>
    </p>

    <p>
      <label for="age">Age:</label><br>
      <input type="number" id="age" name="age" required>
    </p>

    <p>
      <label>Gender:</label><br>
      <input type="radio" name="gender" value="Male"> Male
      <input type="radio" name="gender" value="Female"> Female
      <input type="radio" name="gender" value="Other"> Other
    </p>

    <p>
      <label for="city">City:</label><br>
      <input type="text" id="city" name="city">
    </p>

    <h3>Select a Plan</h3>

    <p>
      <input type="radio" id="basic" name="plan" value="Basic" required>
      <label for="basic">Basic - ₹99/month</label>
    </p>

    <p>
      <input type="radio" id="standard" name="plan" value="Standard">
      <label for="standard">Standard - ₹199/month</label>
    </p>

    <p>
      <input type="radio" id="premium" name="plan" value="Premium">
      <label for="premium">Premium - ₹299/month</label>
    </p>

    <p>
      <input type="checkbox" id="terms" required>
      <label for="terms">
        I agree to the Terms and Conditions
      </label>
    </p>

    <p>
      <input type="submit" value="Subscribe & Continue">
    </p>

  </form>

</body>

</html>
