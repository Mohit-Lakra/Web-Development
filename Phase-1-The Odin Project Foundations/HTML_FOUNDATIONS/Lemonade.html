<body>
  <h1>Lemonade Recipie</h1>
  <h2>Ingredients</h2>
  <ul>
    <li>1 cup of lemon juice</li>
    <li>1 cup of sugar</li>
    <li>4 cups of water</li>
  </ul>

  <h2>Instructions</h2>
  <ol>
    <li>Mix the lemon juice and sugar together until the sugar is dissolved.</li>
    <li>Add the water and stir well.</li>
    <li>Serve over ice and enjoy!</li>
  </ol>
