<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEDIA_Tag</title>
</head>

<body>

  <h1>This is our Media Website</h1>

  <audio controls>
    <source src="sample-audio.mp3" type="audio/mpeg">
    <source src="sample-audio.ogg" type="audio/ogg">
    Your browser does not support the audio element.
  </audio>

  <br><br>

  <video width="320" height="240" controls>
    <source src="sample-video.mp4" type="video/mp4">
    <source src="sample-video.ogg" type="video/ogg">
    Your browser does not support the video tag.
  </video>

  <br><br>

  <!-- Embedding Youtube Video-->
  <iframe width="560" height="315" src="https://www.youtube.com/embed/NGYp1zCBthk?si=onaOk_p1B_gNACHA"
    title="YouTube video player" frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
  </iframe>

</body>

</html>
