<h2>Heading 2</h2>
<h3>Heading 3</h3>
<h4>Heading 4</h4>
<h5>Heading 5</h5>

<!-- Line Break Tag :- Used to create a line break in HTML -->
<br>

<!-- =============================================================================-->

<!-- Paragraph Tag :- Used to define a paragraph in HTML -->
<p>This is a paragraph in HTML. Paragraphs are defined using the &lt;p&gt; tag.</p>

<!-- =============================================================================-->

<!-- Horizontal Rule Tag :- Used to create a horizontal line to separate content -->
<hr>

<!-- =============================================================================-->

<ul>
  <li>Item 1</li>
  <li>Item 2</li>
  <li>Item 3</li>
</ul>
<!-- Ordered List -->

<ol>
  <li>First Item</li>
  <li>Second Item</li>
  <li>Third Item</li>
</ol>
